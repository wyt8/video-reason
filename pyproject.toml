[project]
name = "video-reason"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wyt", email = "2253457010@qq.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.11.0",
]

[project.scripts]
video-reason = "video_reason:main"
video-reason-star = "video_reason.evaluate_star:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
